<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f1a" />
  <title>Build · FastDev Free Tools</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <div class="brand">
        <div class="brand__logo clay">FD</div>
        <div class="brand__text">
          <h1 class="brand__title">Build</h1>
          <p class="brand__sub">FastDev Free Tools</p>
        </div>
      </div>
    </header>

    <main class="app__main maintenance">
      <div class="maint-card clay" data-stagger>
        <div class="maint-icon glass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 12-8.5 8.5a2.12 2.12 0 1 1-3-3L12 9"/>
            <path d="M17.64 15 22 10.64"/>
            <path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/>
          </svg>
        </div>
        <h2 class="maint-title">Under Maintenance</h2>
        <p class="maint-desc">Halaman Build sedang dikerjakan. Sabar ya.</p>

        <div class="maint-progress">
          <div class="maint-progress__bar"></div>
        </div>

        <a href="index.html" class="maint-btn clay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span>Kembali ke Tools 1</span>
        </a>
      </div>
    </main>

    <nav class="toolbar glass" aria-label="Navigasi utama">
      <a href="index.html" class="toolbar__item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Tools 1</span>
      </a>
      <a href="tools2.html" class="toolbar__item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 2 7l10 5 10-5-10-5z"/>
          <path d="m2 17 10 5 10-5"/>
          <path d="m2 12 10 5 10-5"/>
        </svg>
        <span>Tools 2</span>
      </a>
      <a href="build.html" class="toolbar__item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 12-8.5 8.5a2.12 2.12 0 1 1-3-3L12 9"/>
          <path d="M17.64 15 22 10.64"/>
          <path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/>
        </svg>
        <span>Build</span>
      </a>
      <a href="info.html" class="toolbar__item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4"/><path d="M12 8h.01"/>
        </svg>
        <span>Info</span>
      </a>
    </nav>
